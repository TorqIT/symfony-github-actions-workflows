# Continuous Integration for projects using Docker
#
# on:
#   pull_request:
#     types: [opened, reopened, synchronize]
# jobs:
#   ci:
#     uses: Torq-North/symfony-github-actions-workflows/.github/workflows/ci-docker.yml@v1
#     permissions:
#       contents: read
#       actions: read
#       pull-requests: write  # required for post-scan-report to comment on PRs
#     secrets:
#       BUILD_TIME_SECRETS: >
#         {
#           "my-build-secret": "${{ secrets.MY_BUILD_SECRET }}",
#           "my-other-build-secret": "${{ secrets.MY_OTHER_BUILD_SECRET }}"
#         }
#

name: CI

on:
  workflow_call:
    inputs:
      RUNNER:
        required: false
        type: string
        description: Optional self-hosted runner for this workflow (see https://github.com/Torq-North/symfony-github-actions-workflows#self-hosted-runners)
      PROJECT_REPOSITORY:
        required: false
        default: "${{ github.repository }}"
        type: string
        description: "The GitHub repository of the project containing Symfony"
      PROJECT_REPOSITORY_REF:
        required: false
        default: "${{ github.ref }}"
        type: string
        description: "The Git reference (branch, tag, commit SHA) to checkout from the project repository"
      NPM_BUILD:
        required: false
        type: boolean
        description: "Whether an NPM build should be run prior to building the PHP image"
      NPM_RUN_CMD:
        required: false
        type: string
        description: "The NPM command that should be run prior to building the PHP image"
      NPM_SPA:
        required: false
        type: boolean
        description: "Whether the NPM build results in a single-page application"
      SPA_TWIG:
        required: false
        type: string
        default: "default/default.html.twig"
        description: "The path to the Twig file where the result of the NPM single-page application build should be copied"
      FRONTEND_ROOT:
        required: false
        type: string
        default: "frontend"
        description: "The path (relative to the project's root) where frontend files are stored"
      SUBMODULES:
        required: false
        type: boolean
        default: false
        description: "Whether to clone submodules when cloning the project repository"
      BUILD_TIME_ARGS:
        required: false
        type: string
        default: "{}"
        description: "A JSON object containing Docker build-time args in key: value format"
      SYMFONY_ROOT:
        required: false
        type: string
        default: "."
        description: "The path (relative to the project's root) in which the Symfony files are stored (e.g. config, src, etc)"
      INIT_DOCKERFILE:
        required: false
        type: string
        default: ".docker/Dockerfile"
        description: "The path (relative to the project's root) of the Dockerfile used to build the init image"
      INIT_DOCKER_TARGET:
        required: false
        type: string
        default: "init"
        description: "The Docker target to use when building the init image"
      PHP_DOCKERFILE:
        required: false
        type: string
        default: ".docker/Dockerfile"
        description: "The path (relative to the project's root) of the Dockerfile used to build the PHP image"
      PHP_DOCKER_TARGET:
        required: false
        type: string
        default: "php"
        description: "The Docker target to use when building the PHP image"
      SUPERVISORD:
        required: false
        type: boolean
        default: false
        description: "Whether the project uses a supervisord container"
      SUPERVISORD_DOCKERFILE:
        required: false
        type: string
        default: ".docker/Dockerfile"
        description: "The path (relative to the project's root) of the Dockerfile used to build the supervisord image"
      SUPERVISORD_TARGET:
        required: false
        type: string
        default: "supervisord"
        description: "The Docker target to use when building the supervisord image"
      RUN_UNIT_TESTS:
        required: false
        type: boolean
        default: false
        description: "Whether to run unit tests. Default: false, but will be true in future versions"
      RUN_E2E_TESTS:
        required: false
        type: boolean
        default: false
        description: "Whether to run end-to-end tests. Default: false, but will be true in future versions"
      UNIT_TESTS_DIRECTORY:
        required: false
        type: string
        default: "tests"
        description: "The directory where unit tests are located - note this should be relative to the Symfony root, as once inside the container the working directory is set to the Symfony root"
      E2E_TESTS_DIRECTORY:
        required: false
        type: string
        default: "e2e"
        description: "The directory where end-to-end tests are located - note this should be relative to the Symfony root, as once inside the container the working directory is set to the Symfony root"
      PHP_DOCKER_COMPOSE_SERVICE:
        required: false
        type: string
        default: "php"
        description: "The name of the PHP service in your Docker Compose setup used for end-to-end tests"
      NODE_VERSION:
        required: false
        type: string
        default: "25"
        description: "The Node.js version to use when running end-to-end tests"
      GITHUB_APP_CHECKOUT:
        required: false
        type: boolean
        default: false
        description: "Whether to use a GitHub App token for checking out the project repository and submodules"
      POST_SCAN_RESULTS_TO_PR:
        required: false
        type: boolean
        default: false
        description: "Whether to post vulnerability scan results to the associated PR"
      TRIVYIGNORE_PATH:
        required: false
        type: string
        default: ""
        description: "Path to .trivyignore.yaml file (e.g. ./.trivyignore.yaml)"

    secrets:
      BUILD_TIME_SECRETS:
        required: false
        description: A JSON object of secrets required at build-time (see above for example format)
      RUN_TIME_SECRETS:
        required: false
        description: (Optional) A JSON object of secrets required at run-time when running e2e tests
      RECAPTCHA_CLIENT_KEY:
        required: false
        description: (Optional) A client key used when building NPM frontends that require ReCAPTCHA
      GITHUB_APP_ID:
        required: false
        description: The ID of the GitHub App used to generate a token for checking out the project repository and submodules
      GITHUB_APP_PRIVATE_KEY:
        required: false
        description: The private key of the GitHub App used to generate a token for checking out the project repository and submodules

jobs:
  lint:
    name: Lint files
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@ba22d0abdc1eda539aa3ac81af1cfee160b10714 # v1.0.4
        with:
          repository-name: Torq-North/symfony-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Torq-North/symfony-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Lint all files
        uses: ./reusable-workflow/.github/actions/lint

  vulnerability-scan:
    name: Scan for vulnerabilities in dependencies and code (SCA and SAST)
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    outputs:
      npm-outcome: ${{ steps.npm-scan.outcome }}
      composer-outcome: ${{ steps.composer-scan.outcome }}
      semgrep-outcome: ${{ steps.semgrep-scan.outcome }}
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@ba22d0abdc1eda539aa3ac81af1cfee160b10714 # v1.0.4
        with:
          repository-name: Torq-North/symfony-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Torq-North/symfony-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Compute ref slug
        id: ref-slug
        env:
          REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
        run: echo "slug=$(echo "$REF" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Scan for npm vulnerabilities
        id: npm-scan
        continue-on-error: true
        run: |
          result=0
          > /tmp/npm-audit.txt
          while IFS= read -r -d '' f; do
            dir=$(dirname "$f")
            dir_slug=$(echo "$dir" | sed 's|^\./||;s|/|__|g')
            echo "--- Scanning $dir ---" | tee -a /tmp/npm-audit.txt
            npm audit --omit=dev --prefix "$dir" 2>&1 | tee -a /tmp/npm-audit.txt || true
            npm audit --json --omit=dev --prefix "$dir" 2>/dev/null \
              | jq --arg dir "$dir" '. + {_scannedDir: $dir}' \
              > "/tmp/npm-raw-${dir_slug:-root}.json" || true
            jq '[.packages // {} | to_entries[] | select(.key | test("^node_modules/(@[^/]+/[^/]+|[^/]+)$")) | {name: (.key | ltrimstr("node_modules/")), version: .value.version}]' \
              "$dir/package-lock.json" > "/tmp/npm-packages-${dir_slug:-root}.json" 2>/dev/null || echo '[]' > "/tmp/npm-packages-${dir_slug:-root}.json"
            fixable_count=$(jq '[(.vulnerabilities // {}) | to_entries[] | select((.value.severity == "high" or .value.severity == "critical") and .value.fixAvailable == true)] | length' "/tmp/npm-raw-${dir_slug:-root}.json" 2>/dev/null || echo 0)
            if [ "$fixable_count" -gt 0 ]; then
              result=1
            else
              echo "No fixable high/critical vulnerabilities found" | tee -a /tmp/npm-audit.txt
            fi
          done < <(find . -name "package-lock.json" -not -path "*/node_modules/*" -print0)
          exit $result

      - name: Scan for composer vulnerabilities
        id: composer-scan
        continue-on-error: true
        run: |
          install_exit=0
          if [ ! -f "${{ inputs.SYMFONY_ROOT }}/composer.lock" ]; then
            set +e
            composer --working-dir=${{ inputs.SYMFONY_ROOT }} install --prefer-dist --no-scripts --ignore-platform-reqs > /tmp/composer-install.txt 2>&1
            install_exit=$?
            set -e
            cat /tmp/composer-install.txt
          fi
          {
            cat /tmp/composer-install.txt 2>/dev/null || true
            composer --working-dir=${{ inputs.SYMFONY_ROOT }} audit --abandoned=report --locked --no-dev --format=json > /tmp/composer-audit.json 2>/dev/null || true
            composer --working-dir=${{ inputs.SYMFONY_ROOT }} audit --abandoned=report --locked --no-dev || true
            jq '[.packages[] | {name, version}]' "${{ inputs.SYMFONY_ROOT }}/composer.lock" > /tmp/composer-packages.json 2>/dev/null || echo '[]' > /tmp/composer-packages.json
          } 2>&1 | tee /tmp/composer-audit.txt || true
          echo "$install_exit" > /tmp/composer-install-exit.txt
          [ "$install_exit" -eq 0 ] || exit 1
          high_critical_count=$(jq '[.advisories // {} | to_entries[] | .value[] | select(.ignored != true and (.severity == "high" or .severity == "critical"))] | length' /tmp/composer-audit.json 2>/dev/null || echo 0)
          [ "$high_critical_count" -eq 0 ]

      - name: Run Semgrep SAST scan
        id: semgrep-scan
        continue-on-error: true
        run: |
          pip install semgrep --quiet --break-system-packages
          semgrep scan \
            --config p/php \
            --config p/javascript \
            --config p/github-actions \
            --config p/typescript \
            --error \
            --json-output /tmp/semgrep.json \
            . 2>&1 | tee /tmp/semgrep.txt
          exit ${PIPESTATUS[0]}
        env:
          SEMGREP_SEND_METRICS: off

      - name: Upload scan results
        if: always()
        run: |
          mkdir -p scan-results
          cp /tmp/npm-audit.txt scan-results/ 2>/dev/null || true
          cp /tmp/npm-raw-*.json scan-results/ 2>/dev/null || true
          cp /tmp/npm-packages-*.json scan-results/ 2>/dev/null || true
          cp /tmp/composer-audit.txt scan-results/ 2>/dev/null || true
          cp /tmp/composer-audit.json scan-results/ 2>/dev/null || true
          cp /tmp/composer-packages.json scan-results/ 2>/dev/null || true
          cp /tmp/composer-install-exit.txt scan-results/ 2>/dev/null || true
          cp /tmp/semgrep.txt scan-results/ 2>/dev/null || true
          cp /tmp/semgrep.json scan-results/ 2>/dev/null || true

      - name: Upload scan results artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-results-${{ steps.ref-slug.outputs.slug }}
          path: scan-results/
          if-no-files-found: ignore

      - name: Fail if any scan found issues
        if: >-
          steps.npm-scan.outcome == 'failure' ||
          steps.composer-scan.outcome == 'failure' ||
          steps.semgrep-scan.outcome == 'failure'
        run: |
          echo "One or more vulnerability scans found issues - see PR comment for details"
          exit 1

  build-init:
    name: Build init image
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@ba22d0abdc1eda539aa3ac81af1cfee160b10714 # v1.0.4
        with:
          repository-name: Torq-North/symfony-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Torq-North/symfony-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Compute ref slug
        id: ref-slug
        env:
          REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
        run: echo "slug=$(echo "$REF" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker
        uses: ./reusable-workflow/.github/actions/setup-docker
        with:
          DRIVER: docker

      - name: Build init image
        uses: ./reusable-workflow/.github/actions/build-and-push-symfony-image
        with:
          DOCKERFILE_TARGET: ${{ inputs.INIT_DOCKER_TARGET }}
          DOCKERFILE_PATH: ${{ inputs.INIT_DOCKERFILE }}
          BUILD_TIME_ARGS: ${{ inputs.BUILD_TIME_ARGS }}
          BUILD_TIME_SECRETS: ${{ secrets.BUILD_TIME_SECRETS }}
          SYMFONY_ROOT: ${{ inputs.SYMFONY_ROOT }}
          PUSH: false
          TAGS: "init:ci-${{ github.run_id }}"

      - name: Free disk space before Trivy scan if needed
        run: |
          FREE_GB=$(df / --output=avail -BG | tail -1 | tr -d 'G')
          if [ "$FREE_GB" -lt 10 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
            sudo swapoff -a && sudo rm -f /swapfile
          fi
        shell: bash

      - name: Run Trivy vulnerability scanner on image
        id: trivy-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "init:ci-${{ github.run_id }}"
          format: "table"
          output: "trivy-init.txt"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          scanners: "vuln"
          severity: "CRITICAL,HIGH"
          trivyignores: ${{ inputs.TRIVYIGNORE_PATH }}
          timeout: "15m"

      - name: Print Trivy results to log
        if: always()
        run: cat trivy-init.txt 2>/dev/null || true

      - name: Upload Trivy results
        if: always()
        run: echo "${{ steps.trivy-scan.outcome }}" > trivy-init-status.txt

      - name: Upload Trivy results artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results-init-${{ steps.ref-slug.outputs.slug }}
          path: |
            trivy-init.txt
            trivy-init-status.txt
          if-no-files-found: ignore

      - name: Fail if Trivy found vulnerabilities
        if: steps.trivy-scan.outcome == 'failure'
        run: |
          echo "Trivy found CRITICAL or HIGH vulnerabilities in the init image"
          exit 1

  build-php:
    name: Build PHP image
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@ba22d0abdc1eda539aa3ac81af1cfee160b10714 # v1.0.4
        with:
          repository-name: Torq-North/symfony-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Torq-North/symfony-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Compute ref slug
        id: ref-slug
        env:
          REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
        run: echo "slug=$(echo "$REF" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker
        uses: ./reusable-workflow/.github/actions/setup-docker
        with:
          DRIVER: docker

      - name: Build frontend
        if: ${{ inputs.NPM_BUILD == true }}
        uses: ./reusable-workflow/.github/actions/build-frontend
        with:
          SYMFONY_ROOT: ${{ inputs.SYMFONY_ROOT }}
          FRONTEND_ROOT: ${{ inputs.FRONTEND_ROOT }}
          NPM_RUN_CMD: ${{ inputs.NPM_RUN_CMD }}
          NPM_SPA: ${{ inputs.NPM_SPA }}
          SPA_TWIG: ${{ inputs.SPA_TWIG }}
          RECAPTCHA_CLIENT_KEY: ${{ secrets.RECAPTCHA_CLIENT_KEY }}

      - name: Build PHP image
        uses: ./reusable-workflow/.github/actions/build-and-push-symfony-image
        with:
          DOCKERFILE_PATH: ${{ inputs.PHP_DOCKERFILE }}
          DOCKERFILE_TARGET: ${{ inputs.PHP_DOCKER_TARGET }}
          BUILD_TIME_ARGS: ${{ inputs.BUILD_TIME_ARGS }}
          BUILD_TIME_SECRETS: ${{ secrets.BUILD_TIME_SECRETS }}
          SYMFONY_ROOT: ${{ inputs.SYMFONY_ROOT }}
          PUSH: false
          TAGS: "php:ci-${{ github.run_id }}"

      - name: Free disk space before Trivy scan if needed
        run: |
          FREE_GB=$(df / --output=avail -BG | tail -1 | tr -d 'G')
          if [ "$FREE_GB" -lt 10 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
            sudo swapoff -a && sudo rm -f /swapfile
          fi
        shell: bash

      - name: Run Trivy vulnerability scanner on image
        id: trivy-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "php:ci-${{ github.run_id }}"
          format: "table"
          output: "trivy-php.txt"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          scanners: "vuln"
          severity: "CRITICAL,HIGH"
          trivyignores: ${{ inputs.TRIVYIGNORE_PATH }}
          timeout: "15m"

      - name: Print Trivy results to log
        if: always()
        run: cat trivy-php.txt 2>/dev/null || true

      - name: Upload Trivy results
        if: always()
        run: echo "${{ steps.trivy-scan.outcome }}" > trivy-php-status.txt

      - name: Upload Trivy results artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results-php-${{ steps.ref-slug.outputs.slug }}
          path: |
            trivy-php.txt
            trivy-php-status.txt
          if-no-files-found: ignore

      - name: Fail if Trivy found vulnerabilities
        if: steps.trivy-scan.outcome == 'failure'
        run: |
          echo "Trivy found CRITICAL or HIGH vulnerabilities in the php image"
          exit 1

  build-supervisord:
    name: Build supervisord image
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    if: ${{ inputs.SUPERVISORD }}
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@ba22d0abdc1eda539aa3ac81af1cfee160b10714 # v1.0.4
        with:
          repository-name: Torq-North/symfony-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Torq-North/symfony-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Compute ref slug
        id: ref-slug
        env:
          REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
        run: echo "slug=$(echo "$REF" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker
        uses: ./reusable-workflow/.github/actions/setup-docker
        with:
          DRIVER: docker

      - name: Build supervisord image
        uses: ./reusable-workflow/.github/actions/build-and-push-symfony-image
        with:
          DOCKERFILE_PATH: ${{ inputs.SUPERVISORD_DOCKERFILE }}
          DOCKERFILE_TARGET: ${{ inputs.SUPERVISORD_TARGET }}
          BUILD_TIME_ARGS: ${{ inputs.BUILD_TIME_ARGS }}
          BUILD_TIME_SECRETS: ${{ secrets.BUILD_TIME_SECRETS }}
          SYMFONY_ROOT: ${{ inputs.SYMFONY_ROOT }}
          PUSH: false
          TAGS: "supervisord:ci-${{ github.run_id }}"

      - name: Free disk space before Trivy scan if needed
        run: |
          FREE_GB=$(df / --output=avail -BG | tail -1 | tr -d 'G')
          if [ "$FREE_GB" -lt 10 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
            sudo swapoff -a && sudo rm -f /swapfile
          fi
        shell: bash

      - name: Run Trivy vulnerability scanner on image
        id: trivy-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "supervisord:ci-${{ github.run_id }}"
          format: "table"
          output: "trivy-supervisord.txt"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          scanners: "vuln"
          severity: "CRITICAL,HIGH"
          trivyignores: ${{ inputs.TRIVYIGNORE_PATH }}
          timeout: "15m"

      - name: Print Trivy results to log
        if: always()
        run: cat trivy-supervisord.txt 2>/dev/null || true

      - name: Upload Trivy results
        if: always()
        run: echo "${{ steps.trivy-scan.outcome }}" > trivy-supervisord-status.txt

      - name: Upload Trivy results artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results-supervisord-${{ steps.ref-slug.outputs.slug }}
          path: |
            trivy-supervisord.txt
            trivy-supervisord-status.txt
          if-no-files-found: ignore

      - name: Fail if Trivy found vulnerabilities
        if: steps.trivy-scan.outcome == 'failure'
        run: |
          echo "Trivy found CRITICAL or HIGH vulnerabilities in the supervisord image"
          exit 1

  post-scan-report:
    name: Post security scan results to PR
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    needs: [vulnerability-scan, build-init, build-php, build-supervisord]
    if: (success() || failure()) && github.event_name == 'pull_request' && inputs.POST_SCAN_RESULTS_TO_PR
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@ba22d0abdc1eda539aa3ac81af1cfee160b10714 # v1.0.4
        with:
          repository-name: Torq-North/symfony-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Torq-North/symfony-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Post security scan results
        uses: ./reusable-workflow/.github/actions/post-scan-report
        with:
          NPM_OUTCOME: ${{ needs.vulnerability-scan.outputs.npm-outcome }}
          COMPOSER_OUTCOME: ${{ needs.vulnerability-scan.outputs.composer-outcome }}
          SEMGREP_OUTCOME: ${{ needs.vulnerability-scan.outputs.semgrep-outcome }}
          SUPERVISORD: ${{ inputs.SUPERVISORD }}
          REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  run-unit-tests:
    name: Run unit tests
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    if: ${{ inputs.RUN_UNIT_TESTS }}
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@ba22d0abdc1eda539aa3ac81af1cfee160b10714 # v1.0.4
        with:
          repository-name: Torq-North/symfony-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Torq-North/symfony-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Set up Docker
        uses: ./reusable-workflow/.github/actions/setup-docker

      - name: Run unit tests
        uses: ./reusable-workflow/.github/actions/run-unit-tests
        with:
          DOCKERFILE: ${{ inputs.INIT_DOCKERFILE || inputs.PHP_DOCKERFILE }}
          DOCKERFILE_TARGET: ${{ inputs.INIT_DOCKER_TARGET || inputs.PHP_DOCKER_TARGET }}
          BUILD_TIME_ARGS: ${{ inputs.BUILD_TIME_ARGS }}
          BUILD_TIME_SECRETS: ${{ secrets.BUILD_TIME_SECRETS }}
          SYMFONY_ROOT: ${{ inputs.SYMFONY_ROOT }}
          UNIT_TESTS_DIRECTORY: ${{ inputs.UNIT_TESTS_DIRECTORY }}

  run-e2e-tests:
    name: Run e2e tests
    if: ${{ inputs.RUN_E2E_TESTS != '' }}
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@ba22d0abdc1eda539aa3ac81af1cfee160b10714 # v1.0.4
        with:
          repository-name: Torq-North/symfony-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Torq-North/symfony-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Setup Docker
        uses: ./reusable-workflow/.github/actions/setup-docker

      - name: Run e2e tests
        uses: ./reusable-workflow/.github/actions/run-e2e-tests
        with:
          BUILD_TIME_SECRETS: ${{ secrets.BUILD_TIME_SECRETS }}
          RUN_TIME_SECRETS: ${{ secrets.RUN_TIME_SECRETS }}
          NODE_VERSION: ${{ inputs.NODE_VERSION }}
          TESTS_DIRECTORY: "${{ inputs.E2E_TESTS_DIRECTORY }}"
          PHP_DOCKER_COMPOSE_SERVICE: ${{ inputs.PHP_DOCKER_COMPOSE_SERVICE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
